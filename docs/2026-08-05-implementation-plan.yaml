  # ---------- A: arch self-reporting (P1.5) - BEFORE the final bundle ----------
  - id: A1
    phase: P1.5
    title: "Code: DependencyStatus.arch via Mach-O parse + UI banner"
    why: "Turns the Apple article's manual Get-Info check into something the app does itself. Ordered BEFORE the final bundle so the daily-driver .app ships with it (critic: otherwise a second build is needed)."
    edits:
      - file: src-tauri/src/macho.rs (new)
        spec: |
          pub fn detect_arch(path: &Path) -> String
          returns one of: "arm64" | "x86_64" | "universal" | "script:<inner>" | "unknown"
          Parse rules (ENDIANNESS IS PER-HEADER - the critic flagged that naive
          parsing passes its own wrong tests):
          - read first 4096 bytes
          - THIN Mach-O: on-disk LITTLE-ENDIAN. u32 LE at 0 == 0xfeedfacf (MH_MAGIC_64)
            -> cputype u32 LE at 4: 0x0100000C => arm64 (arm64e shares cputype;
            IGNORE cpusubtype, report arm64), 0x01000007 => x86_64.
            Also accept byte-swapped magic (0xcffaedfe as LE u32) with BE cputype.
          - FAT: header is BIG-ENDIAN. u32 BE at 0 == 0xcafebabe (fat32) or
            0xcafebabf (fat64) -> nfat_arch u32 BE at 4, SANITY CAP nfat<=16
            (0xcafebabe is also the Java .class magic; a huge nfat means not a
            fat binary -> "unknown"). Entries at 8, stride 20 (fat32) / 32 (fat64),
            cputype u32 BE at entry+0. >=2 distinct known arches => "universal";
            exactly one => that arch.
          - SHEBANG: bytes start "#!" -> take first whitespace-token as interpreter
            path, fs::canonicalize it, recurse detect_arch ONCE (no deeper) ->
            "script:" + result. (CRITIC: yt-dlp is ALWAYS a script; without shebang
            resolution the x86-only banner can never fire for the one dependency
            most likely to be Intel. e.g. Intel-brew yt-dlp -> script:x86_64 = WARN;
            pip yt-dlp -> script:universal = fine.)
          - anything else -> "unknown"
          Unit tests REQUIRED: crafted byte arrays for thin-arm64, thin-x86_64,
          fat-universal (BE!), java-class lookalike -> unknown, shebang tempfile
          resolving to a real binary.
      - file: src-tauri/src/lib.rs
        spec: |
          - mod macho; DependencyStatus gains arch: Option<String> (Serialize'd).
          - check_environment() populates arch via macho::detect_arch on each
            resolved tool path.
      - file: src/main.ts + index.html + src/styles.css
        spec: |
          - render arch beside each dependency row
          - banner (dismissable, non-blocking) when any dep arch is "x86_64" or
            "script:x86_64": "Intel-only binary - stops working after macOS 27
            (Rosetta removal). Install the Apple silicon version."
    verify:
      - cmd: cd src-tauri && cargo test
        expect: 13 existing + new macho tests all pass
      - cmd: npx tsc --noEmit
        expect: clean
    commit: true
    commit_message_theme: "Add architecture self-reporting to environment check (Rosetta deadline: HT102527). Why: app must warn about Intel deps itself; Get-Info is manual. Decision: shebang resolves one level so script deps (yt-dlp) get real verdicts; arm64e reports arm64."

