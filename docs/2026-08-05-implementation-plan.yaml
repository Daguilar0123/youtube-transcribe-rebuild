  - id: D2
    phase: P3
    title: CI goes live
    why: ".github/workflows/ci.yml is COMMITTED ALONGSIDE THIS PLAN (repo is public -> macOS runners free). It runs npm build BEFORE cargo test because tauri::generate_context! requires ../dist to exist at compile time and dist/ is gitignored (critic: bare cargo test fails on a fresh runner)."
    depends_on: [H1]
