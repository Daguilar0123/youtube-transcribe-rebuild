  # ---------- M: MCP server (P2) ----------
  - id: M1
    phase: P2
    title: "ProgressSink refactor - decouple pipeline from Tauri"
    why: "Foundation for BOTH the MCP binary and the deferred iPhone client. Scope is exactly the 11 functions in symbol_map.apphandle_refactor_scope; hybrid.rs is untouched."
    edits:
      - file: src-tauri/src/lib.rs
        spec: |
          - pub trait ProgressSink: Send + Sync { fn emit(&self, level: &str, stage: &str, message: &str); }
          - MUST be used as Arc<dyn ProgressSink>, NOT &dyn: run_command (lib.rs:354)
            moves the sink into thread::spawn'd stdout/stderr reader threads which
            require 'static (CRITIC-VERIFIED: &dyn does not compile here). Threads
            clone the Arc exactly as they clone AppHandle today.
          - struct TauriSink(AppHandle) - impl via tauri::Emitter (current emit() body).
          - struct StderrSink - writes "level/stage: message" lines to stderr
            (MCP-safe: stdout is protocol-only). struct NullSink for tests.
          - Extract cores with UNCHANGED behavior:
            run_youtube_job_core(sink: Arc<dyn ProgressSink>, req: YoutubeJobRequest) -> Result<JobResult, String>
            run_local_job_core(...), run_hybrid_merge_job_core(...)
          - #[tauri::command] fns become 3-line wrappers: wrap app in Arc<TauriSink>, call core.
          - Keep request structs' camelCase serde untouched (Tauri IPC contract).
    verify:
      - cmd: cd src-tauri && cargo test && cargo check
        expect: all pass, no behavior change
      - cmd: "grep -c 'AppHandle' src-tauri/src/lib.rs"
        expect: "AppHandle appears ONLY in TauriSink + the 3 command wrappers"
    commit: true
    commit_message_theme: "Decouple pipeline from Tauri via ProgressSink (Arc<dyn>, thread-clone pattern). Why: one core for GUI + MCP + future iOS backend. Decision: Arc not &dyn because run_command's reader threads need 'static."

  - id: M2
    phase: P2
    title: Feature-gated MCP binary scaffold
    why: "required-features keeps tokio/rmcp OUT of the default build - the crate's staticlib crate-type is the future 'tauri ios build' path and must not drag a server stack into it (critic)."
    depends_on: [M1]
    edits:
      - file: src-tauri/Cargo.toml
        spec: |
          [features] mcp = ["dep:rmcp", "dep:tokio", "dep:schemars"]
          [dependencies] rmcp = { version = "3.1", optional = true, features = [<server + stdio transport - CONFIRM exact names on docs.rs/rmcp/3.1.1 before pinning>] }
          tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }
          schemars = { <match the version rmcp 3.1 re-exports/requires>, optional = true }
          [[bin]] name = "yt-transcribe-mcp"  path = "src/bin/mcp/main.rs"  required-features = ["mcp"]
    verify:
      - cmd: cd src-tauri && cargo check                       # default features
        expect: "clean AND does not build the bin or compile tokio/rmcp"
      - cmd: cd src-tauri && cargo check --features mcp --bin yt-transcribe-mcp
        expect: clean
    commit: false

  - id: M3
    phase: P2
    title: "Security guard module (all four critic vectors)"
    edits:
      - file: src-tauri/src/bin/mcp/guard.rs (new)
        spec: |
          validate_youtube_url(url) -> Result<String, String>:
          - must start "https://" (kills leading-dash option injection AND non-http schemes)
          - reject any whitespace/newline chars
          - host allowlist: www.youtube.com, youtube.com, m.youtube.com,
            music.youtube.com, youtu.be (kills SSRF via yt-dlp's generic extractor)
          - reject pure playlist URLs (path starts /playlist) for ALL tools;
            strip &list=/?list= params from watch URLs
          confine_output_dir(requested: Option<String>) -> Result<PathBuf, String>:
          - default: $HOME/Documents/Transcripts (create if absent)
          - create requested dir, then fs::canonicalize BOTH it and the base;
            require canonical(requested).starts_with(canonical($HOME/Documents/Transcripts))
            (kills path traversal, symlink escapes, and move_or_copy's
            delete-then-write landing outside the sandbox - lib.rs:697 removes
            existing destination files)
          confine_input_path(p) -> Result<PathBuf, String>:
          - canonicalize; must exist; must start_with $HOME
          - CONSENT MODEL (document in SKILL.md + README): within $HOME these
            tools read model-supplied paths without per-file prompts once the
            MCP server is allowlisted; that is the accepted tradeoff for a
            single-user machine, and the $HOME confinement is the boundary.
          ALSO (defense in depth, benefits the GUI too): in lib.rs, insert "--"
          before the URL positional in get_youtube_title, download_captions,
          download_media arg builders.
          Unit tests REQUIRED: dash-URL, http://, file://, LAN host, playlist URL,
          ../ traversal, symlink-escape via tempdir, nonexistent input.
    verify:
      - cmd: cd src-tauri && cargo test --features mcp
        expect: guard tests pass
    commit: false

  - id: M4
    phase: P2
    title: MCP tools + envelope contract
    depends_on: [M2, M3]
    edits:
      - file: src-tauri/src/bin/mcp/main.rs
        spec: |
          rmcp 3.1 server, name "yt-transcribe". Param structs: snake_case,
          derive(Deserialize, JsonSchema); convert internally to the camelCase
          request structs (construct in Rust - no serde roundtrip).
          TOOLS:
          1. youtube_metadata { url }
             - guard url; run [yt-dlp, --no-playlist, -J, --, url] via detect_tools() path
             - parse in-process; PROJECT ONLY: title, channel, uploader, duration_seconds,
               upload_date, view_count, description (cap 4000 chars), caption_languages
               (keys of subtitles + automatic_captions), webpage_url
             - INVARIANT: raw -J output (~1MB) never leaves the process
          2. youtube_transcript { url, mode: captions|whisper|hybrid, output_dir?,
                                  model_path?, whisper_prompt?, max_len? }
             - mode map: captions->captions_only, whisper->whisper_only, hybrid->hybrid
             - media_action: "audio", keep_media: false
             - model default when whisper/hybrid and model_path absent:
               scan_models()[0] (today ggml-medium.en.bin; after N4, large-v3-turbo);
               error with download instructions if none
             - run run_youtube_job_core under tokio spawn_blocking
          3. transcribe_local { path, mode: convert_transcribe|transcribe_only,
                                output_dir?, model_path?, whisper_prompt?, max_len? }
             -> run_local_job_core (guard input path)
          4. hybrid_merge { whisper_srt, youtube_srt, info_json?, output_dir?, output_base? }
             -> run_hybrid_merge_job_core (guard all input paths)
          ENVELOPE (every job tool): { status, title_base, mode, model_used,
            files: [{path, kind, bytes}], transcript_path (preference:
            .hybrid.txt > .whisper.txt > .youtube-captions.txt),
            replacements?, flagged_segments?, duration_ms,
            inline_transcript? (ONLY if transcript file <= 16000 bytes) }
          Larger transcripts: the CLIENT Reads transcript_path with offset/limit.
          CONCURRENCY: one static tokio::sync::Mutex serializes tools 2-4
          (metadata exempt) - same-base filename collisions and the shared-temp-dir
          millisecond race (lib.rs unique_temp_dir) are real (critic); v1 policy
          is serialize, not per-job UUID dirs.
          PROGRESS: McpSink implements ProgressSink by forwarding emits as MCP
          progress notifications when the client sent a progressToken (rmcp
          RequestContext), else StderrSink. Progress notifications also keep
          long whisper jobs alive past client tool timeouts.
          PREFLIGHT in main(): output base writable; detect_tools() finds yt-dlp
          + ffmpeg (+ whisper-cli when a model exists); clear stderr error if not.
    verify:
      - cmd: cd src-tauri && cargo test --features mcp && cargo check --features mcp --bin yt-transcribe-mcp
        expect: clean
    commit: true
    commit_message_theme: "Add yt-transcribe-mcp: MCP stdio server over the shared pipeline core. Why: Claude reaches for WebFetch (measured 28/33 attempts) and gets one field; the app already produces clean artifacts 2x cheaper. Decisions: envelope-not-payload (16KB inline cap), 4-vector guard (https+allowlist, --, $HOME confinement, output sandbox), serialize jobs v1, model default = scan_models()[0] echoed as model_used."

  - id: M5
    phase: P2
    title: Build, install, register, trigger
    depends_on: [M4]
    confirm_with_user: true   # writes user-scope MCP config + Danny's global CLAUDE.md
    commands:
      - cd src-tauri && cargo install --path . --bin yt-transcribe-mcp --features mcp
        # -> ~/.cargo/bin/yt-transcribe-mcp: stable path, survives cargo clean
        # (critic: a target/ symlink breaks on clean)
      - claude mcp add --scope user --transport stdio yt-transcribe -- /Users/danielaguilar/.cargo/bin/yt-transcribe-mcp
    edits:
      - file: .mcp.json (repo root, committed)
        spec: '{ "mcpServers": { "yt-transcribe": { "command": "${HOME}/.cargo/bin/yt-transcribe-mcp", "timeout": 3600000 } } }   # timeout ms: hour-long whisper jobs'
      - file: ~/.claude/skills/youtube-transcript/SKILL.md (user-level, NOT in repo)
        spec: |
          frontmatter description (triggering): "Use whenever a YouTube URL appears
          in the conversation or the user asks to transcribe, summarize, or analyze
          a YouTube video or local audio/video file. Uses Danny's local
          yt-transcribe MCP (yt-dlp + whisper.cpp + hybrid merge) instead of
          WebFetch/WebSearch, which cannot read YouTube."
          body: tool selection (metadata first when only facts are needed; captions
          mode = fast default; hybrid = accuracy/proper nouns; whisper = no captions
          or local file), envelope handling (Read transcript_path with offset/limit;
          never ask for inline dumps), prohibitions (never WebFetch youtube.com,
          never request raw info.json), consent-model note for local-file tools.
      - file: ~/.claude/CLAUDE.md (append one backstop line, confirm first)
        spec: "Given a YouTube URL, use the yt-transcribe MCP tools (youtube_metadata / youtube_transcript) - never WebFetch or WebSearch for the video's own content."
    verify:
      - cmd: claude mcp list
        expect: yt-transcribe listed, connects
    commit: true
    commit_message_theme: "Register yt-transcribe MCP + repo .mcp.json. Why: measured 85% WebFetch reflex needs both a triggering skill and a CLAUDE.md backstop; user-scope registration + ~/.cargo/bin path survives cargo clean."

