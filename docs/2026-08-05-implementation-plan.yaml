deferred:   # recorded so future plans do not rediscover them
  - "Universal build: npm run tauri build -- --target universal-apple-darwin (both targets installed by N1) - at GitHub-release time; roughly doubles build time; low value for a single arm64 machine"
  - "Developer ID signing + notarization - REQUIRED for the public release (Gatekeeper); locally-built arm64 gets ad-hoc linker signing and runs fine"
  - "Dependency bundling vs discover-on-PATH - decide at release time; bundling would have hidden the yt-dlp staleness failure behind a release cycle"
  - "iPhone: thin client of this Mac's core (Tauri iOS shell CANNOT spawn yt-dlp/ffmpeg/whisper). M1's ProgressSink core is the shared foundation; required-features (M2) keeps the server stack out of the iOS lib"
  - "Intel Homebrew tree (/usr/local, 122 pkgs) retirement - owner decision before macOS 27"
  - "stash@{0} drop - owner's call; audited semantic-zero on 2026-08-05; recovery sha 08c6604761ebd23139b3e821d675465053fcfa9a (git fsck --unreachable finds it until gc)"
  - "Optional: pip install 'yt-dlp[default,curl-cffi]' if YouTube tightens further (impersonation); brew formula already bundles it"

