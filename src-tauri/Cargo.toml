[package]
name = "youtube-transcribe-rebuild"
version = "0.1.0"
description = "A Tauri desktop app for YouTube and local media transcription with ffmpeg and whisper.cpp"
authors = ["Daniel Aguilar"]
edition = "2021"

[lib]
name = "youtube_transcribe_rebuild_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
